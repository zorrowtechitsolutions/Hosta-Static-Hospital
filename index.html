
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Hosta Healthcare | Your Complete Healthcare Companion</title>

    <meta
      name="description"
      content="Connect with doctors, hospitals, and clinics through Hosta Healthcare. Book appointments, manage health records, and explore blood bank services."
    />

    <meta name="author" content="Zorrow Tech IT Solutions" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://hostahealthcare.com/"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/splash-icon.png" />
    <link rel="apple-touch-icon" href="/splash-icon.png" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta
      property="og:site_name"
      content="Hosta Healthcare"
    />
    <meta
      property="og:url"
      content="https://hostahealthcare.com/"
    />
    <meta
      property="og:title"
      content="Hosta Healthcare | Your Complete Healthcare Companion"
    />
    <meta
      property="og:description"
      content="Connect with doctors, hospitals, and clinics through Hosta Healthcare. Book appointments, manage health records, and explore blood bank services."
    />
    <meta
      property="og:image"
      content="https://hostahealthcare.com/splash-icon.png"
    />
    <meta
      property="og:image:alt"
      content="Hosta Healthcare"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Hosta Healthcare | Your Complete Healthcare Companion"
    />
    <meta
      name="twitter:description"
      content="Connect with doctors, book appointments, manage health records, and explore healthcare services with Hosta."
    />
    <meta
      name="twitter:image"
      content="https://hostahealthcare.com/splash-icon.png"
    />

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Hosta Healthcare",
        "url": "https://hostahealthcare.com/"
      }
    </script>

    <!-- Mobile Application Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Hosta",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Android, iOS",
        "url": "https://hostahealthcare.com/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
